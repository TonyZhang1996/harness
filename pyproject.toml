[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.2.0"
description = "A safe, interactive, OpenAI-compatible local coding agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ai-harness = "ai_harness.cli:main"
harness = "ai_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
