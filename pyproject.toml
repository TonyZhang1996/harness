[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.6.2"
description = "A safe, cross-platform, OpenAI-compatible local coding agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "Pillow>=10.0",
    "playwright>=1.40"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.0; platform_system == 'Windows'",
]

[project.scripts]
ai-harness = "ai_harness.cli:main"
harness = "ai_harness.cli:main"
harness-gui = "ai_harness.gui:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
