[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.1.0"
description = "A lightweight AI coding harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai"
]

[project.scripts]
ai-harness = "ai_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
